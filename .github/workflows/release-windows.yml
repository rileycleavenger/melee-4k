name: Release (Windows)

# The player-facing Windows zip:
#   Melee4K/
#     Melee4K/              melee.exe, DLLs, resources (tools/package_windows.sh)
#     PUT-YOUR-ROM-HERE/
#     Setup.exe             tools/setup/setup.py frozen with PyInstaller
#     README.txt            platforms/release/README.txt
# The game is cross-built on Linux (cheap runner minutes); only freezing
# Setup.exe needs Windows, since PyInstaller does not cross-compile.
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Texture pack manifest URL baked into Setup (empty = none)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  game:
    name: Build melee.exe (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake zip cabextract curl mingw-w64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
      - name: Build and package
        env:
          TARGET_ARCH: x86_64
        run: tools/package_windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: game
          path: dist/Melee-Windows-x86_64.zip
          if-no-files-found: error

  release:
    name: Assemble Melee4K-Windows
    needs: game
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: game
          path: game
      - name: Freeze Setup.exe
        shell: pwsh
        env:
          MANIFEST: ${{ github.event.inputs.manifest }}
        run: |
          python -m pip install pyinstaller
          $src = Get-Content tools/setup/setup.py -Raw
          if ($env:MANIFEST) {
            $src = $src -replace '(?m)^DEFAULT_MANIFEST = .*$', "DEFAULT_MANIFEST = `"$env:MANIFEST`""
          }
          Set-Content -Path setup_frozen.py -Value $src -NoNewline
          python -m PyInstaller --onefile --console --name Setup setup_frozen.py
      - name: Assemble and zip
        shell: pwsh
        run: |
          Expand-Archive game/Melee-Windows-x86_64.zip -DestinationPath unpacked
          $stage = "out/Melee4K"
          New-Item -ItemType Directory -Force "$stage/PUT-YOUR-ROM-HERE" | Out-Null
          Move-Item unpacked/melee-windows-x86_64 "$stage/Melee4K"
          Copy-Item dist/Setup.exe $stage
          Copy-Item platforms/release/README.txt $stage
          Set-Content "$stage/PUT-YOUR-ROM-HERE/put your .iso here.txt" `
            "Put your Super Smash Bros. Melee (USA 1.02) disc image in this folder."
          Compress-Archive -Path $stage -DestinationPath out/Melee4K-Windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Melee4K-Windows-x86_64
          path: out/Melee4K-Windows-x86_64.zip
          if-no-files-found: error
